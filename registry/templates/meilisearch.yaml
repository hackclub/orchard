apiVersion: leaf/v1
kind: Template
metadata:
  name: meilisearch
  displayName: 'Meilisearch'
  description: 'A fast, typo-tolerant search engine with an easy API. Internal-only; front it from your app.'
  icon: https://github.com/meilisearch.png?size=256
  version: '1.1.1'
  category: database
  tags: ['search', 'api']
  keywords: ['algolia', 'typesense', 'full text search', 'elasticsearch alternative']
  homepage: https://www.meilisearch.com
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'meilisearch'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: masterKey
    displayName: 'Master key'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 32
  - name: storage
    displayName: 'Storage'
    description: 'Volume for indexes'
    type: string
    default: '5Gi'

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 1Gi
      image: getmeili/meilisearch:v1.58
      replicas: 1
      ports:
        - name: http
          containerPort: 7700
          servicePort: 7700
          protocol: TCP
      volumes:
        - name: data
          type: pvc
          mountPath: /meili_data
          storageSize: '{{ params.storage }}'
      env:
        - key: MEILI_MASTER_KEY
          value: '{{ params.masterKey }}'
          secret: true
        - key: MEILI_ENV
          value: production
        - key: MEILI_NO_ANALYTICS
          value: 'true'
