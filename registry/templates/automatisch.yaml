apiVersion: leaf/v1
kind: Template
metadata:
  name: automatisch
  displayName: 'Automatisch'
  description: 'Open-source Zapier alternative. Connect apps with triggers and actions, no code.'
  icon: https://github.com/automatisch.png?size=256
  version: '1.1.1'
  category: automation
  tags: ['automation', 'workflows', 'integrations']
  keywords: ['zapier', 'n8n', 'triggers', 'actions']
  homepage: https://automatisch.io
  license: AGPL-3.0-only

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'automatisch'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'automatisch.example.com'
  - name: appSecretKey
    displayName: 'App secret key'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 32
  - name: encryptionKey
    displayName: 'Encryption key'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 32
  - name: webhookSecretKey
    displayName: 'Webhook secret key'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 32
  - name: storage
    displayName: 'Storage'
    description: 'Volume for data'
    type: string
    default: '2Gi'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: '{{ params.appName }}-db'
      resources:
        cpu: 500m
        memory: 1Gi

  - name: cache
    type: deployment
    config:
      name: '{{ params.appName }}-cache'
      resources:
        cpu: 500m
        memory: 512Mi
      image: valkey/valkey:8-alpine
      replicas: 1
      ports:
        - name: valkey
          containerPort: 6379
          servicePort: 6379
          protocol: TCP

  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 1Gi
      image: automatischio/automatisch:0.15.0
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      volumes:
        - name: storage
          type: pvc
          mountPath: /automatisch/storage
          storageSize: '{{ params.storage }}'
      env:
        - key: APP_ENV
          value: production
        - key: HOST
          value: '{{ params.domain }}'
        - key: PROTOCOL
          value: https
        - key: PORT
          value: '3000'
        - key: APP_SECRET_KEY
          value: '{{ params.appSecretKey }}'
          secret: true
        - key: ENCRYPTION_KEY
          value: '{{ params.encryptionKey }}'
          secret: true
        - key: WEBHOOK_SECRET_KEY
          value: '{{ params.webhookSecretKey }}'
          secret: true
        - key: POSTGRES_HOST
          value: '{{ resources.db.host }}'
        - key: POSTGRES_PORT
          value: '{{ resources.db.port }}'
        - key: POSTGRES_DATABASE
          value: '{{ resources.db.dbName }}'
        - key: POSTGRES_USERNAME
          value: '{{ resources.db.dbUser }}'
        - key: POSTGRES_PASSWORD
          value: '{{ resources.db.dbPassword }}'
          secret: true
        - key: REDIS_HOST
          value: '{{ resources.cache.serviceName }}'
        - key: REDIS_PORT
          value: '6379'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
