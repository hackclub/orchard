apiVersion: leaf/v1
kind: Template
metadata:
  name: homarr
  displayName: 'Homarr'
  description: 'A drag-and-drop dashboard for your services with integrations and per-user boards.'
  icon: https://github.com/homarr-labs.png?size=256
  version: '1.1.1'
  category: developer
  tags: ['dashboard', 'start page']
  keywords: ['homepage', 'heimdall', 'dashy', 'launcher']
  homepage: https://homarr.dev
  license: Apache-2.0

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'homarr'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'dash.example.com'
  - name: encryptionKey
    displayName: 'Encryption key'
    description: 'Generated if left empty'
    type: secret
    validation:
      bytes: 32
      encoding: 'hex'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 512Mi
      image: ghcr.io/homarr-labs/homarr:v2
      replicas: 1
      ports:
        - name: http
          containerPort: 7575
          servicePort: 7575
          protocol: TCP
      volumes:
        - name: appdata
          type: pvc
          mountPath: /appdata
          storageSize: '2Gi'
      env:
        - key: SECRET_ENCRYPTION_KEY
          value: '{{ params.encryptionKey }}'
          secret: true

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 7575
