apiVersion: leaf/v1
kind: Template
metadata:
  name: syncthing
  displayName: 'Syncthing'
  description: 'Continuous file sync between your devices, no cloud in the middle. The sync port is published so devices outside can reach it.'
  icon: https://github.com/syncthing.png?size=256
  version: '1.1.1'
  category: files
  tags: ['sync', 'files', 'p2p']
  keywords: ['dropbox alternative', 'file sync', 'backup', 'resilio']
  homepage: https://syncthing.net
  license: MPL-2.0

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'syncthing'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    description: 'The web UI, protect it with Orchard protection'
    type: string
    required: true
    placeholder: 'sync.example.com'
  - name: storage
    displayName: 'Storage'
    description: 'Volume for the synced folders'
    type: string
    default: '50Gi'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 512Mi
      image: lscr.io/linuxserver/syncthing:version-v2.1.7
      replicas: 1
      ports:
        - name: http
          containerPort: 8384
          servicePort: 8384
          protocol: TCP
        - name: sync
          containerPort: 22000
          servicePort: 22000
          protocol: TCP
          public: true
        - name: discovery
          containerPort: 21027
          servicePort: 21027
          protocol: UDP
          public: true
      volumes:
        - name: config
          type: pvc
          mountPath: /config
          storageSize: '1Gi'
        - name: data
          type: pvc
          mountPath: /data
          storageSize: '{{ params.storage }}'
      env:
        - key: PUID
          value: '1000'
        - key: PGID
          value: '1000'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 8384
