apiVersion: leaf/v1
kind: Template
metadata:
  name: flowise
  displayName: 'Flowise'
  description: 'Drag-and-drop LLM apps and agents. Chains, tools, vector stores, an API for each flow.'
  icon: https://github.com/FlowiseAI.png?size=256
  version: '1.1.1'
  category: ai
  tags: ['llm', 'agents', 'low code']
  keywords: ['langchain', 'langflow', 'chatbot builder', 'rag']
  homepage: https://flowiseai.com
  license: Apache-2.0

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'flowise'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'flowise.example.com'
  - name: secretKey
    displayName: 'Credential encryption key'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 32
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: '{{ params.appName }}-db'
      resources:
        cpu: 500m
        memory: 1Gi

  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 1Gi
      image: flowiseai/flowise:3.1.4
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      volumes:
        - name: data
          type: pvc
          mountPath: /root/.flowise
          storageSize: '2Gi'
      env:
        - key: PORT
          value: '3000'
        - key: DATABASE_TYPE
          value: postgres
        - key: DATABASE_HOST
          value: '{{ resources.db.host }}'
        - key: DATABASE_PORT
          value: '{{ resources.db.port }}'
        - key: DATABASE_NAME
          value: '{{ resources.db.dbName }}'
        - key: DATABASE_USER
          value: '{{ resources.db.dbUser }}'
        - key: DATABASE_PASSWORD
          value: '{{ resources.db.dbPassword }}'
          secret: true
        - key: FLOWISE_SECRETKEY_OVERWRITE
          value: '{{ params.secretKey }}'
          secret: true
        - key: DISABLE_FLOWISE_TELEMETRY
          value: 'true'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
