apiVersion: leaf/v1
kind: Template
metadata:
  name: pocketbase
  displayName: 'PocketBase'
  description: 'A backend in one file: SQLite, realtime, auth and an admin UI. Create the first admin on first visit.'
  icon: https://github.com/pocketbase.png?size=256
  version: '1.1.1'
  category: backend
  tags: ['backend', 'baas', 'sqlite']
  keywords: ['firebase alternative', 'supabase lite', 'realtime', 'auth']
  homepage: https://pocketbase.io
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'pocketbase'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'pb.example.com'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 250m
        memory: 256Mi
      image: ghcr.io/muchobien/pocketbase:0.42
      replicas: 1
      ports:
        - name: http
          containerPort: 8090
          servicePort: 8090
          protocol: TCP
      volumes:
        - name: data
          type: pvc
          mountPath: /pb_data
          storageSize: '5Gi'
        - name: public
          type: pvc
          mountPath: /pb_public
          storageSize: '1Gi'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 8090
