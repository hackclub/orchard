apiVersion: leaf/v1
kind: Template
metadata:
  name: zipline
  displayName: 'Zipline'
  description: 'A file and screenshot host with ShareX support, short links and an admin UI.'
  icon: upload
  version: '1.1.1'
  category: files
  tags: ['uploads', 'sharex', 'screenshots']
  keywords: ['file host', 'image host', 'imgur', 'sharex server']
  homepage: https://zipline.diced.sh
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'zipline'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'i.example.com'
  - name: coreSecret
    displayName: 'Core secret'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 42
  - name: storage
    displayName: 'Storage'
    description: 'Volume for data'
    type: string
    default: '20Gi'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: '{{ params.appName }}-db'
      resources:
        cpu: 500m
        memory: 1Gi

  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 512Mi
      image: ghcr.io/diced/zipline:4.8.4
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      volumes:
        - name: uploads
          type: pvc
          mountPath: /zipline/uploads
          storageSize: '{{ params.storage }}'
      env:
        - key: CORE_SECRET
          value: '{{ params.coreSecret }}'
          secret: true
        - key: DATABASE_URL
          value: '{{ resources.db.connectionString }}'
          secret: true
        - key: CORE_PORT
          value: '3000'
        - key: CORE_RETURN_HTTPS_URLS
          value: 'true'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
