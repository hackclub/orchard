apiVersion: leaf/v1
kind: Template
metadata:
  name: docuseal
  displayName: 'DocuSeal'
  description: 'Document signing. Build forms from PDFs, send them, collect signatures.'
  icon: https://github.com/docusealco.png?size=256
  version: '1.1.1'
  category: forms
  tags: ['esignature', 'pdf', 'documents']
  keywords: ['docusign', 'sign pdf', 'contracts', 'documenso']
  homepage: https://www.docuseal.com
  license: AGPL-3.0-only

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'sign'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'sign.example.com'
  - name: secretKeyBase
    displayName: 'Secret key base'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 64
  - name: storage
    displayName: 'Storage'
    description: 'Volume for documents'
    type: string
    default: '5Gi'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: '{{ params.appName }}-db'
      resources:
        cpu: 500m
        memory: 1Gi

  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 1Gi
      image: docuseal/docuseal:3.4.0
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      volumes:
        - name: data
          type: pvc
          mountPath: /data/docuseal
          storageSize: '{{ params.storage }}'
      env:
        - key: DATABASE_URL
          value: '{{ resources.db.connectionString }}'
          secret: true
        - key: SECRET_KEY_BASE
          value: '{{ params.secretKeyBase }}'
          secret: true
        - key: HOST
          value: '{{ params.domain }}'
        - key: FORCE_SSL
          value: '{{ params.enableTls }}'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
