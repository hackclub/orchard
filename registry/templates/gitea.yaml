apiVersion: leaf/v1
kind: Template
metadata:
  name: gitea
  displayName: 'Gitea'
  description: 'A lightweight self-hosted Git service with issues, pull requests and CI.'
  icon: https://github.com/go-gitea.png?size=256
  version: '1.1.1'
  category: developer
  tags: ['git', 'code hosting', 'ci', 'issues']
  keywords: ['github alternative', 'gitlab', 'forgejo', 'repositories', 'actions']
  homepage: https://about.gitea.com
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'gitea'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'git.example.com'
  - name: disableSignups
    displayName: 'Disable sign-ups'
    description: 'On means only the first account (yours) can register'
    type: boolean
    default: true
  - name: requireSignin
    displayName: 'Require sign-in to view'
    type: boolean
    default: false
  - name: enableActions
    displayName: 'Gitea Actions'
    type: boolean
    default: true
  - name: lfs
    displayName: 'Git LFS'
    type: boolean
    default: true
  - name: siteTitle
    displayName: 'Site title'
    type: string
    default: 'Gitea'
  - name: defaultPrivate
    displayName: 'New repositories private by default'
    type: boolean
    default: true
  - name: smtpHost
    displayName: 'SMTP host'
    description: 'Outgoing mail for notifications and password resets. Optional.'
    type: string
    default: ''
    placeholder: 'smtp.example.com'
  - name: smtpPort
    displayName: 'SMTP port'
    type: number
    default: 587
  - name: smtpUser
    displayName: 'SMTP username'
    type: string
    default: ''
    placeholder: 'postmaster@example.com'
  - name: smtpPassword
    displayName: 'SMTP password'
    type: string
    default: ''
    placeholder: 'app password'
  - name: mailFrom
    displayName: 'From address'
    type: string
    default: ''
    placeholder: 'noreply@example.com'
  - name: storage
    displayName: 'Storage'
    description: 'Volume for repositories, LFS objects and attachments'
    type: string
    default: '20Gi'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: '{{ params.appName }}-db'
      resources:
        cpu: 500m
        memory: 1Gi

  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 1Gi
      image: gitea/gitea:1
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      volumes:
        - name: data
          type: pvc
          mountPath: /data
          storageSize: '{{ params.storage }}'
      env:
        - key: GITEA__database__DB_TYPE
          value: postgres
        - key: GITEA__database__HOST
          value: '{{ resources.db.host }}:{{ resources.db.port }}'
        - key: GITEA__database__NAME
          value: '{{ resources.db.dbName }}'
        - key: GITEA__database__USER
          value: '{{ resources.db.dbUser }}'
        - key: GITEA__database__PASSWD
          value: '{{ resources.db.dbPassword }}'
          secret: true
        - key: GITEA__server__DOMAIN
          value: '{{ params.domain }}'
        - key: GITEA__server__ROOT_URL
          value: 'https://{{ params.domain }}/'
        - key: GITEA__server__HTTP_PORT
          value: '3000'
        - key: GITEA__server__LFS_START_SERVER
          value: '{{ params.lfs }}'
        - key: GITEA__service__DISABLE_REGISTRATION
          value: '{{ params.disableSignups }}'
        - key: GITEA__service__REQUIRE_SIGNIN_VIEW
          value: '{{ params.requireSignin }}'
        - key: GITEA__actions__ENABLED
          value: '{{ params.enableActions }}'
        - key: APP_NAME
          value: '{{ params.siteTitle }}'
        - key: GITEA__repository__DEFAULT_PRIVATE
          value: '{{ params.defaultPrivate }}'
        - key: GITEA__mailer__ENABLED
          value: 'true'
        - key: GITEA__mailer__PROTOCOL
          value: smtp+starttls
        - key: GITEA__mailer__SMTP_ADDR
          value: '{{ params.smtpHost }}'
        - key: GITEA__mailer__SMTP_PORT
          value: '{{ params.smtpPort }}'
        - key: GITEA__mailer__USER
          value: '{{ params.smtpUser }}'
        - key: GITEA__mailer__PASSWD
          value: '{{ params.smtpPassword }}'
          secret: true
        - key: GITEA__mailer__FROM
          value: '{{ params.mailFrom }}'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
