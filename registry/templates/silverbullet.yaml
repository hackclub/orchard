apiVersion: leaf/v1
kind: Template
metadata:
  name: silverbullet
  displayName: 'SilverBullet'
  description: 'A markdown notes app that feels like a programmable notebook. Files on a volume, works offline.'
  icon: https://github.com/silverbulletmd.png?size=256
  version: '1.1.1'
  category: docs
  tags: ['notes', 'markdown']
  keywords: ['obsidian', 'logseq', 'personal wiki', 'plain text']
  homepage: https://silverbullet.md
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'notes'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'notes.example.com'
  - name: user
    displayName: 'Username'
    type: string
    default: 'admin'
    required: true
  - name: password
    displayName: 'Password'
    description: 'Generated if left empty'
    type: secret
    validation:
      min: 16
  - name: storage
    displayName: 'Storage'
    description: 'Volume for your markdown files'
    type: string
    default: '2Gi'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 250m
        memory: 256Mi
      image: ghcr.io/silverbulletmd/silverbullet:3.0.0
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      volumes:
        - name: space
          type: pvc
          mountPath: /space
          storageSize: '{{ params.storage }}'
      env:
        - key: SB_USER
          value: '{{ params.user }}:{{ params.password }}'
          secret: true

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
