apiVersion: leaf/v1
kind: Template
metadata:
  name: excalidraw
  displayName: 'Excalidraw'
  description: 'A whiteboard with a hand-drawn feel. No accounts, drawings stay in the browser.'
  icon: https://github.com/excalidraw.png?size=256
  version: '1.1.1'
  category: developer
  tags: ['whiteboard', 'diagrams', 'static']
  keywords: ['sketch', 'drawing', 'wireframe', 'diagram tool']
  homepage: https://excalidraw.com
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'excalidraw'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'draw.example.com'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 100m
        memory: 128Mi
      image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
      replicas: 1
      ports:
        - name: http
          containerPort: 80
          servicePort: 80
          protocol: TCP

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 80
