apiVersion: v1
kind: Pod
metadata:
  name: app-clusterip-7d9f8c5b6-x2k4p
  labels:
    app.kubernetes.io/name: app-clusterip
    app.kubernetes.io/managed-by: orchard
    pod-template-hash: 7d9f8c5b6
  namespace: orchard-policy-test
spec:
  automountServiceAccountToken: false
  runtimeClassName: gvisor
  containers:
    - name: app-clusterip
      image: registry.example.com/org/app:1
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      env:
        - name: A
          value: b
        - name: HOST
          value: 0.0.0.0
        - name: FORCE_COLOR
          value: '1'
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
        - name: scratch
          mountPath: /tmp
          readOnly: false
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - SETUID
            - SETGID
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
            - SYS_CHROOT
            - NET_BIND_SERVICE
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-clusterip-data
    - name: scratch
      emptyDir: {}
