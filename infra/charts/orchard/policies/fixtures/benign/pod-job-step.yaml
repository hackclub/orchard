apiVersion: v1
kind: Pod
metadata:
  name: job-1-abcde
  labels:
    app.kubernetes.io/managed-by: orchard-job
    orchard/job-id: 11111111-1111-1111-1111-111111111111
    orchard/project-id: 22222222-2222-2222-2222-222222222222
    orchard/step-order: '1'
  namespace: orchard-policy-test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  runtimeClassName: gvisor
  containers:
    - name: step
      image: registry.example.com/org/app:1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - '-c'
        - echo hi
      env:
        - name: ORCHARD_JOB_ID
          value: 11111111-1111-1111-1111-111111111111
        - name: ORCHARD_STEP_ORDER
          value: '1'
        - name: A
          value: b
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - SETUID
            - SETGID
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
            - SYS_CHROOT
            - NET_BIND_SERVICE
        seccompProfile:
          type: RuntimeDefault
