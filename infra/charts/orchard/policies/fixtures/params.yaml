apiVersion: v1
kind: ConfigMap
metadata:
  name: orchard-tenant-policy
  namespace: orchard
data:
  serverUser: "system:serviceaccount:orchard:orchard-server"
  ingressClass: "haproxy"
  allowedIssuers: "letsencrypt-prod,letsencrypt-dns01-wildcard"
  storageClasses: "longhorn,longhorn-nvme,longhorn-ssd,longhorn-static,longhorn-build-scratch"
  allowNodePort: "true"
  allowLoadBalancer: "true"
  runtimeClass: "gvisor"
  databaseRuntimeClass: ""
  deviceRuntimeClasses: "nvidia.com/gpu=nvidia"
  protectionProxyIPs: ""
  tenantSecretsRole: "orchard-tenant-secrets"
  pgPreloadLibraries: "pg_stat_statements,pgvector,vector,timescaledb,pg_trgm,postgis"
  pgImagePrefixes: "ghcr.io/cloudnative-pg/postgresql:"
