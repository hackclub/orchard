# Where everything is installed. createNamespace renders the Namespace object for
# this one, and for gateway.namespace and certificates.namespace when they are in
# use and do not exist yet. Those two are kept on uninstall. Set false to manage
# all of them yourself.
namespace: orchard
createNamespace: true

image:
  registry: ghcr.io
  repository: hackclub/orchard
  # each component tag is the version of its last release; an empty tag falls
  # back to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Datadog APM for the server: traces, continuous profiler, runtime metrics,
# error tracking. Off unless you run a Datadog agent. Talks to the agent
# DaemonSet through its ClusterIP service (internalTrafficPolicy: Local →
# node-local agent). The app only loads dd-trace when DD_AGENT_HOST is present.
datadog:
  enabled: false
  agentHost: datadog.monitoring.svc.cluster.local
  env: production
  profiling: true
  # App & API Protection: WAF-style detection (SQLi/XSS/SSRF, credential
  # stuffing, scanners) on real traffic, plus API Security (endpoint schema
  # discovery + sensitive-data flagging). Detection-only by default —
  # blocking is enabled per-rule from the Datadog UI via Remote Config.
  appsec: true

# Requests are sized for what these pods actually consume at rest, not for
# their peak — that's what limits and the HPAs below are for. Requests are the
# number the scheduler reserves, so inflating them wastes real capacity on
# small clusters.
frontend:
  enabled: true
  replicas: 2
  image:
    name: frontend
    tag: "1.89.0"
  service:
    port: 3000
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  # Requires metrics-server. When enabled, `replicas` above is ignored and
  # omitted from the Deployment so upgrades don't fight the autoscaler.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: null
  # Where the dashboard's Source link points. Empty means the upstream repository.
  # Set this if you run a modified version of Orchard.
  sourceUrl: ""
  env: []

# How the server finds the real client address behind your ingress. Every
# per-IP limit keys on it, so this must describe your topology; a private
# address is never trusted merely for being private.
#   trustProxy:  number of proxy hops in front of the server (1 = a single
#                ingress controller such as Traefik or HAProxy; 2 = a load
#                balancer plus the ingress), or a comma-separated CIDR list of
#                proxies to trust. "0" trusts nothing and uses the socket peer.
#   trustedProxyRanges: extra proxy CIDRs trusted at any position (a CDN or
#                external load balancer).
#   trustCloudflare: also skip Cloudflare's published edge ranges.
#   header / headerFrom: Cloudflare Tunnel installs. Read the client address
#                from this request header (cf-connecting-ip), but only when the
#                hop that connected falls in headerFrom (the pod CIDR of the
#                namespace running cloudflared, with Traefik reachable only from
#                it). Leave both empty otherwise.
clientIp:
  trustProxy: "1"
  trustedProxyRanges: ""
  trustCloudflare: true
  header: ""
  headerFrom: ""

server:
  enabled: true
  replicas: 2
  image:
    name: server
    tag: "2.97.1"
  service:
    port: 3001
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  # Extra env vars (DATABASE_URL is injected automatically from the CNPG secret)
  env: []
  envFrom: []
  # Dedicated worker pods run builds, notifications and the k8s apply queue,
  # leaving api pods enqueue-only. They share the server image and env.
  workers:
    enabled: false
    replicas: 2
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits: { cpu: "2", memory: "2Gi" }
    # Builds are the burstiest thing Orchard runs, so workers get the widest
    # range and a lower target: queue latency matters more than pod count.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 60

# Signup policy for the platform: open | invite_only | closed.
signupMode: invite_only

# Cluster knobs for tenant workloads (user apps/databases). An empty storageClass
# uses the cluster's default StorageClass; the other two fall back to haproxy and
# letsencrypt-prod.
tenant:
  storageClass: ""
  ingressClass: ""
  certClusterIssuer: ""
  # Fallback external IP that publicly exposed ports and databases are
  # published on. An organization that sets its own overrides this; one that
  # has not set anything inherits it instead of being told to configure an IP
  # it does not know. Empty means every organization must set its own, which is
  # the old behaviour.
  publicIp: ""
  # Raw NodePort exposure (an app port reachable on every node's IP, in the
  # cluster's node-port range). Right for a single-node install, where the node
  # IP is the public IP. On a shared multi-node cluster that publishes ports on
  # a load-balancer IP (publicIp above or the organization's own), set false so
  # tenants cannot open ports on every node.
  nodePortExposure: true
  # Most public ports (NodePorts, app public ports, public databases) one
  # organization may hold. Empty keeps the server default of 20; 0 is unlimited.
  maxPublicPortsPerOrg: ""
  # Caps each tenant pod's outbound bandwidth through the standard
  # kubernetes.io/egress-bandwidth annotation, as TENANT_EGRESS_BANDWIDTH (for
  # example "50M"). Empty sets nothing. It only takes effect where the CNI
  # shapes traffic: Cilium with bandwidthManager.enabled=true, or the bandwidth
  # CNI plugin, which k3s chains after its default Flannel. Other CNIs ignore
  # the annotation. Pods pick it up on their next rollout.
  egressBandwidth: ""
  # Seed for the caps of NEW organizations, as NEW_ORG_CPU and NEW_ORG_MEMORY.
  # Empty means new organizations are uncapped; "0" or "unlimited" also mean no
  # cap. A superadmin can set the instance default for new organizations in the
  # admin panel, which wins over this seed. Existing organizations are never
  # changed, and an administrator can edit any organization's caps afterwards.
  newOrgCpu: ""
  newOrgMemory: ""
  # A hard ceiling on projects, extra environments (one namespace each) and
  # deployments for every organization. Empty or 0 means no ceiling; per
  # organization limits are set in the admin panel. An organization already over a
  # limit keeps what it has and just cannot create more.
  maxProjectsPerOrg: ""
  maxEnvironmentsPerOrg: ""
  maxDeploymentsPerOrg: ""
  # Most custom (non-generated) hostnames one organization may hold, and most it
  # may add per hour, as MAX_CUSTOM_DOMAINS_PER_ORG and
  # MAX_CUSTOM_DOMAIN_CREATES_PER_HOUR. Empty keeps the server defaults of 250 and
  # 30; 0 is unlimited. Proof of domain ownership is on by default when
  # signupMode is open (override with CUSTOM_DOMAIN_VERIFICATION in server.env).
  maxCustomDomainsPerOrg: ""
  maxCustomDomainCreatesPerHour: ""
  # Namespaces a tenant pod may be reached from, and reach. Every tenant
  # namespace is default-deny, so the ingress controller has to be on this list
  # or it cannot reach the app at all.
  #
  # The symptom when it is wrong is not an obviously dead site, it is a
  # certificate that never issues: the ACME HTTP-01 solver runs as a pod in the
  # tenant namespace, the controller cannot reach it, and Let's Encrypt gets a
  # 502 instead of the token.
  #
  # Empty means network,orchard, which is where this project runs HAProxy. Traefik
  # in its own namespace wants "traefik,orchard". The Traefik bundled with k3s runs
  # in kube-system, so that cluster wants "kube-system,orchard".
  ingressNamespaces: ""
  # TCP ports a tenant pod may reach on those namespaces. Empty means
  # 80,443,8000,8080,8443. The controller's stats and pprof ports stay closed.
  ingressPorts: ""
  # Outbound TCP ports tenant pods may not use on the internet, as a
  # comma-separated list. Empty blocks nothing.
  egressBlockPorts: ""
  # Cilium entities tenants may not reach. Empty means
  # host,remote-node,kube-apiserver. "none" turns the extra policy off; set that
  # if the ingress controller uses hostNetwork and apps call their own hostname.
  denyEntities: ""
  # Extra IPv4 addresses or CIDRs added to the egress deny list on top of the
  # node, apiserver and pod addresses the server finds itself.
  extraDenyCidrs: ""
  # Where the CloudNativePG operator runs. Tenant namespaces are default-deny, so
  # the operator has to be let in to manage a database. Empty leaves the server's
  # default, postgresql. The symptom when it is wrong is a database stuck on
  # "Instance Status Extraction Error".
  cnpgOperatorNamespace: ""
  # Comma-separated suffixes that generated app URLs are built under, each
  # optionally naming a wildcard TLS Secret you manage:
  #   ".apps.example.com=wildcard-apps-example-com-tls"  reuse that Secret
  #   ".apps.example.com"                                issue per host
  #
  # Leave empty and the suffix is derived from gateway.http.appDomain, with a
  # Secret only when gateway.http.appWildcardSecretName names one. Without a
  # wildcard, each host gets its own certificate from certClusterIssuer above,
  # which needs no DNS-01 and no way to copy a Secret between namespaces.
  #
  # Per host costs one issuance each, against Let's Encrypt's 50 per registered
  # domain per week (eTLD+1, so every subdomain shares one budget). Past roughly
  # 50 URLs a week, set up a wildcard instead — see https://docs.orchard.hackclub.com/operate/wildcard-certificates/.
  wildcardDomains: ""

# Cilium-specific features: per-tenant CiliumNetworkPolicy and the
# CiliumEnvoyConfig that enforces basic auth on an ingress. Only enable on
# clusters running Cilium as the CNI — on k3s/Traefik the CRDs don't exist and
# the server falls back to plain NetworkPolicy.
#
# Enabling grants the cilium.io rbac and sets CILIUM_ENABLED=true. Left off,
# the server probes the cluster instead of assuming, and picks the enforcement
# point for basic auth from the answer: the Envoy filter where Cilium is
# available, Orchard's own protection proxy where it isn't. Basic auth works
# either way. See https://docs.orchard.hackclub.com/deploy/protection/.
cilium:
  enabled: false

# Which protection modes an ingress can be put into.
#
# Basic auth and shared-password protection are always available: with Cilium
# basic auth is an Envoy filter bound to the Service, without it the same
# credentials are enforced by Orchard's own protection proxy, which needs
# nothing from the CNI.
#
# "Sign in with Orchard" is the odd one out. It bounces visitors of a tenant
# host to the control plane's login and requires project membership, so it only
# makes sense when the people you are gating already have Orchard accounts, and
# it needs FRONTEND_URL to be reachable from wherever the app is served. Off by
# default for that reason.
#
# The flag gates picking the mode, not enforcing it: turning it off later does
# not drop the wall on hosts that already use it.
protection:
  orchardLogin: false

# Ingress policies for the control-plane namespaces: the release namespace
# (server, mcp, frontend, Postgres, pooler), the metrics namespace
# (VictoriaMetrics, VictoriaLogs, vmagent, kube-state-metrics) and r2-proxy.
#
# Tenant egress policies already keep tenant pods out. These close the other
# direction for everything that is not a tenant: builds, sandboxes, image scans
# and tenant namespaces cannot reach platform pods, whatever their own egress
# policy says. Any other namespace (the ingress controller, the CNPG operator,
# monitoring agents, cert-manager) keeps its access, so nothing has to be listed.
#
# Needs a CNI that enforces NetworkPolicy. Turn it off only if one of your own
# tools in an untrusted namespace has to call the control plane.
networkPolicy:
  platform:
    enabled: true
    # Namespaces to treat like tenants, on top of the managed tenant
    # namespaces and the builders, sandbox, fc-builder and trivy namespaces.
    untrustedNamespaces: []
  # With Cilium, deny the builders, sandbox, fc-builder and trivy namespaces the
  # host, remote-node and kube-apiserver entities (tenant.denyEntities changes
  # the list). Tenant namespaces get the same policy from the server.
  egressDeny:
    enabled: true
  # Run kube-router on every node as a policy-only enforcer, the controller k3s
  # embeds. For clusters whose CNI is plain Flannel (the Talos default), which
  # ignores NetworkPolicy. Do not enable it next to Cilium, Calico, Antrea,
  # Canal or k3s's own controller: they already enforce.
  enforcer:
    enabled: false
    namespace: orchard-netpol
    image: cloudnativelabs/kube-router:v2.12.0@sha256:e1da38f71e2f1521e7a74c5cdaa511fdee9d2ee76972b25c9b5785b030b96fe4
    priorityClassName: system-node-critical
    resources:
      requests: { cpu: 250m, memory: 250Mi }
    tolerations:
      - { operator: Exists, effect: NoSchedule }
      - { operator: Exists, effect: NoExecute }
      - { key: CriticalAddonsOnly, operator: Exists }
    extraArgs: []

# Control-plane Redis. Backs the cross-replica SSE event bus (Redis Streams)
# so live updates reach SSE clients on every server replica, and is available
# as a general cache. REDIS_URL is injected into the server automatically when
# enabled. The app degrades to local-only delivery + polling if it's absent.
redis:
  enabled: true
  image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
  storage: 1Gi
  storageClass: ""
  # Override to point at an external/managed Redis; otherwise the in-cluster
  # service is used.
  url: ""
  # Requires a password. The chart keeps one in the redis-auth Secret, minting a
  # random one on first install and reusing it on every upgrade (it reads the
  # existing Secret with lookup, so a GitOps tool that only runs `helm template`
  # should set password below instead). Ignored when url points at an external
  # Redis.
  auth:
    enabled: true
    password: ""
  networkPolicy:
    enabled: true
  # Caps the dataset so a flood of keys makes Redis shed expiring entries
  # (rate-limit windows, caches, idempotency and SSO state, all of which carry a
  # TTL) instead of growing until the kernel OOM-kills it. volatile-ttl never
  # evicts a key without a TTL, so durable data is refused rather than lost.
  # maxmemory is derived from the memory limit below (maxmemoryPercent of it);
  # set maxmemory (e.g. "256mb") to pin it.
  maxmemory: ""
  maxmemoryPercent: 50
  maxmemoryPolicy: volatile-ttl
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# Remote MCP server (server/Dockerfile.mcp). Exposes the Orchard MCP over HTTP
# on its own domain so external MCP clients can connect.
mcp:
  enabled: true
  replicas: 1
  image:
    name: mcp
    tag: "2.97.1"
  service:
    port: 3100
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: null
  # Extra env vars (DATABASE_URL is injected automatically from the CNPG secret).
  env: []
  envFrom: []
  # The origin clients actually reach, when it is not what the route below
  # implies. Behind a tunnel the route terminates plaintext in-cluster while the
  # world connects over https, and an OAuth issuer that disagrees with the URL
  # the client typed is rejected. Empty derives it from the route.
  url: ""
  # Traefik IngressRoute. Set host to the public domain you want the MCP to
  # respond on (e.g. mcp.orchard.my). Leave empty to skip creating the route.
  #
  # The host is also what MCP_BASE_URL, the frontend's PUBLIC_MCP_URL and
  # SANDBOX_MCP_URL are derived from, so setting it here is the whole of
  # "point the MCP at this instance".
  ingress:
    enabled: true
    host: ""
    entryPoints: [websecure]
    tls:
      enabled: true
      # If set, used as IngressRoute tls.secretName. Otherwise Traefik will
      # fall back to its default cert resolver / wildcard.
      secretName: ""
      # Name a ClusterIssuer and the chart issues the MCP host's certificate
      # itself, the same way ingress.tls.issuerRef does for the UI. Without
      # either this or secretName, Traefik terminates with its self-signed
      # TRAEFIK DEFAULT CERT and every MCP client refuses to connect.
      issuerRef: {}
    middlewares: []

# CloudNativePG cluster. The CNPG operator must already be installed in the
# cluster — this chart only creates the Cluster resource.
postgres:
  enabled: true
  name: orchard-db
  instances: 1
  imageName: "" # leave empty to use CNPG default
  database: orchard
  owner: orchard
  storage:
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  walSlotKeepSize: 2GB
  backup:
    enabled: false
    method: barman
    destinationPath: ""
    endpointURL: ""
    secretName: orchard-db-backup
    retentionPolicy: 30d
    schedule: "0 30 1 * * *"
    walMaxParallel: 4
  # PgBouncer in front of the database (a CNPG Pooler in transaction mode).
  # Orchard's own queries go through it, so Postgres sees at most
  # instances x defaultPoolSize connections from them however many server
  # pods are running, including both sides of a rollout. Migrations and graft
  # database pools keep connecting directly.
  pooler:
    enabled: false
    instances: 2
    defaultPoolSize: 20
    maxClientConn: 1000
    image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:6c91fd7383b8b098bc0c3b71dba4e98bd568c0d301b9fc66027fbc23259c6a7d
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

# Traefik IngressRoute connecting frontend (/) and backend (/apiv1).
ingress:
  enabled: true
  host: orchard.local
  # Additional hostnames the dashboard answers on. Traefik routes by Host
  # header, so a name that is not listed here gets a 404 even though the box is
  # reachable at it: a LAN install wants its IP, its machine name and its
  # Tailscale name to all work. These are matched, not certified. Adding one to
  # a TLS install without a certificate that covers it means a browser warning.
  extraHosts: []
  entryPoints: [websecure]
  tls:
    enabled: true
    # The Secret Traefik terminates with. A bare `tls:` block with neither this
    # nor issuerRef below makes Traefik fall back to its self-signed
    # TRAEFIK DEFAULT CERT, which is a browser error, not a working install.
    secretName: ""
    # Set to have the chart issue that certificate for `host` itself, e.g.
    # { name: letsencrypt, kind: ClusterIssuer }. Leave empty when the Secret
    # is created out of band, as the HackClub install does.
    issuerRef: {} # if set, used as IngressRoute tls.secretName
  # extra middlewares (refs) applied to all routes
  middlewares: []

# Builders namespace + RBAC + secrets (from k8s/image-builder-setup.yaml).
builders:
  enabled: true
  namespace: orchard-builders
  buildkitImage: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
  # Image for rootless builds, which is what runs by default. Empty derives it
  # from buildkitImage by adding the "-rootless" tag suffix and dropping any
  # digest, so set both when you mirror BuildKit.
  buildkitRootlessImage: moby/buildkit:v0.34.2-rootless@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1
  # Without builderSandbox, builds run in rootless BuildKit: no privileged
  # container, uid 1000, user namespaces. It needs nodes that allow unprivileged
  # user namespaces. Setting this true restores the old behaviour, a PRIVILEGED
  # BuildKit container on the node's runc, where a Dockerfile RUN step is root on
  # the node. Ignored when builderSandbox gives builds a runtime class. Never
  # enable it on an instance that builds code from users you do not trust.
  allowPrivilegedOnHost: false
  railpackVersion: v0.43.0
  # Credentials for the registry builds push to, written to every host listed
  # here. With any host listed, username and password are required.
  harbor:
    username: ""
    password: ""
    hosts: []
  # Registries buildkit talks plain http to. Anything not listed is https.
  httpRegistries:
    - harbor-core.harbor.svc.cluster.local
  r2:
    accessKeyId: ""
    secretAccessKey: ""
  # In-cluster destinations the builder is allowed to reach, on top of DNS and
  # public IPs on 80/443. This is where the image push goes, so a registry that
  # is not on this list fails the build with "connection refused" once the build
  # itself has succeeded.
  #
  # The defaults describe this project's own cluster: Harbor's core pods (the
  # only thing a push talks to) and the ingress controller on its serving ports.
  # Other pods in those namespaces, and the controller's stats and pprof ports,
  # stay closed. A self-hosted instance
  # running its registry somewhere else (zot in the release namespace, a
  # registry in its own namespace, ...) has to add it here. It is deliberately
  # not defaulted to the release namespace: the whole point of this policy is
  # that a build running untrusted repo code cannot reach the Orchard API or
  # database, which live there.
  #
  # Object storage served through an ingress in this cluster needs the ingress
  # controller's pods here too: a build fetches its context from it, and a
  # public hostname that resolves to a node loops back to those pods.
  #
  #   registryEgress:
  #     - namespace: orchard
  #       podLabels:
  #         app: zot
  #       ports:
  #         - port: 5000
  registryEgress:
    - namespace: harbor
      podLabels:
        component: core
      ports:
        - port: 80
        - port: 8080
    - namespace: network
      podLabels:
        app.kubernetes.io/name: kubernetes-ingress
      ports:
        - port: 80
        - port: 443
        - port: 8000
        - port: 8080
        - port: 8443
  # Local on-cluster BuildKit cache backed by a PVC. When enabled, the server
  # configures build jobs to use a `type=local` cache instead of S3/R2.
  # Pin build jobs to a dedicated node labelled `orchard-builder=true`. When
  # enabled, jobs also tolerate an `orchard-builder` NoSchedule taint so the
  # node can be reserved exclusively for builds.
  #   kubectl label node <name> orchard-builder=true
  #   kubectl taint node <name> orchard-builder=true:NoSchedule   # optional
  dedicatedNode:
    enabled: false
  # Architecture user images are built for: linux/amd64 or linux/arm64. Build
  # pods are pinned to nodes of that architecture so builds run natively, and
  # when this is set, apps built by Orchard are pinned there too so a mixed
  # amd64/arm64 cluster never schedules an image onto a node that cannot run
  # it. Empty builds linux/amd64 and leaves app placement alone.
  platform: ""
  localCache:
    enabled: true
    size: 100Gi
    # Empty uses the cluster's default StorageClass. storageClassName is
    # immutable on a PVC, so an existing cache keeps whatever it was made with
    # only if this still names it.
    storageClass: ""
    path: /cache/buildkit
    pvcName: buildkit-cache
    accessMode: ReadWriteOnce
    # BuildKit GC ceilings. These are PER TENANT, not per volume: every build
    # runs its own buildkitd rooted in its own subPath of this PVC, so BuildKit
    # has no idea the other tenants exist and N of them can hold N x
    # gcKeepBytes. Keeping the total under `size` is `evict`'s job below; these
    # only stop one tenant hogging the volume on its own.
    # gcEphemeralKeepBytes caps high-churn types (local source, RUN cache
    # mounts, git checkouts); gcKeepBytes is the total cap across everything.
    gcKeepBytes: 18GB
    gcEphemeralKeepBytes: 1GB
    # Tenant-level eviction, run by the `cache-evict` init container before
    # every build. It mounts this PVC at its root (no subPath) so it still
    # starts when the volume is 100% full — which is exactly when the build
    # container cannot start, because kubelet can no longer mkdir its subPath.
    evict:
      # Evict any tenant untouched for this long, pressure or not.
      maxAgeDays: 14
      # Above highPct, evict least-recently-used tenants until under targetPct.
      highPct: 80
      targetPct: 60
      # Never evict a tenant whose cache moved this recently — assume a build
      # is in flight.
      idleMinutes: 60
      # Total GiB the cache may hold before the least-recently-used tenants are
      # evicted. Empty means no byte budget, only highPct. Volumes that do not
      # enforce their size, such as local-path, need this. Admins can change it
      # under Admin -> Builds.
      maxGiB: ""
  quota:
    requestsCpu: "16"
    requestsMemory: "32Gi"
    limitsCpu: "32"
    limitsMemory: "100Gi"
    pods: "10"

# Orchard-metrics stack (VictoriaMetrics single-node + vmagent + exporters).
# This is the largest idle cost in the chart. It powers the deployment metrics
# graphs and the usage pages. On a small cluster shrink the resources and the
# retention below rather than turning it off: off, those views go empty.
metrics:
  enabled: true
  namespace: orchard-metrics
  # The `cluster` label vmagent stamps on every series. Changing it starts new
  # series, so history before the change stops matching queries that select on it.
  clusterLabel: orchard
  # Which pods are the real ingress controller. vmagent scrapes only these
  # namespaces and labels, so a tenant pod that copies a label cannot feed
  # forged request or error series. Defaults match the installer (Traefik in
  # `traefik`) and the HAProxy variant (`network`). On your own cluster set
  # the namespace and labels of your controller's pods; the server reads the
  # namespaces (INGRESS_METRICS_*_NAMESPACE) and only trusts series from the
  # `traefik` / `haproxy-ingress` scrape jobs.
  ingress:
    traefik:
      namespaces: [traefik]
      labels:
        app.kubernetes.io/name: traefik
      portName: metrics
    haproxy:
      namespaces: [network]
      labels:
        app.kubernetes.io/name: kubernetes-ingress
      portName: stat
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    retention: 30d
    # VictoriaMetrics sizes its cache as a share of the memory *limit*, so it
    # grows to fill whatever it's given. Lower the limit to lower idle RSS.
    memoryAllowedPercent: 60
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1", memory: "1Gi" }
    storage:
      size: 5Gi
      # Empty uses the cluster's default StorageClass.
      storageClass: ""
  vmagent:
    image: victoriametrics/vmagent:v1.156.0@sha256:d3229ab469c54ae5266e86246932266bad29b06668b5371acbd6d3de1b3035e7
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  kubeStateMetrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    resources:
      requests: { cpu: "20m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }
  nodeExporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    resources:
      requests: { cpu: "20m", memory: "32Mi" }
      limits: { cpu: "200m", memory: "128Mi" }

# In-app log store: VictoriaLogs (single node) fed by a Vector DaemonSet that
# tails tenant pods and the ingress controller's JSON access log. Lives in
# metrics.namespace but is toggled on its own. Powers the Logs tab search and
# per-route HTTP stats; live tailing still reads the pod log stream directly.
logs:
  enabled: true
  retention: 14d
  # Oldest daily partitions are dropped once the store exceeds this, whatever
  # the retention says. Keep it under storage.size.
  maxDiskSpaceUsage: 16GiB
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1", memory: "1Gi" }
    storage:
      size: 20Gi
      # Empty uses the cluster's default StorageClass.
      storageClass: ""
  vector:
    image: timberio/vector:0.61.0-distroless-libc@sha256:1a3451978644d5cd4b99a0b28c990791e2f7e1efbea4184122f1c59a56448143
    # Host directory for file checkpoints, so a restarted pod resumes where it
    # left off instead of re-shipping every file.
    dataDir: /var/lib/vector-orchard
    bufferEvents: 20000
    # Most log lines per second one tenant namespace may ship to the shared log
    # store (Vector throttle transform, keyed by namespace). Lines above it are
    # dropped, counted in Vector's component_discarded_events_total, and only for
    # that namespace, so one noisy app cannot push every other tenant's history
    # out of the store. 0 turns the limit off.
    throttle:
      eventsPerSecond: 2000
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

# Gateway API objects. Orchard does not support Gateway API yet: tenant apps
# route through Ingress and the server creates no HTTPRoute or listener, so these
# Gateways carry no traffic. Leave enabled false. gateway.http.appDomain below is
# read either way: it is the app domain.
gateway:
  enabled: false
  namespace: network
  gatewayClassName: traefik
  http:
    enabled: true
    name: http-gateway
    # Hostname pattern for autogenerated app domains. Must align with
    # APP_DOMAIN (server) and PUBLIC_APP_DOMAIN (frontend).
    # Empty renders no wildcard listener and issues no wildcard Certificate.
    appDomain: ""
    # Secret holding the wildcard cert for *.{appDomain}. Either:
    #   - issued by certificates.wildcards.app below (chart-managed), or
    #   - pre-existing in {namespace} (set certificates.wildcards.app.enabled: false).
    # Empty derives `wildcard-<appDomain with dots as dashes>-tls`.
    appWildcardSecretName: ""
  # A TCP Gateway with a placeholder listener. Public databases use
  # LoadBalancer Services, not this Gateway.
  db:
    enabled: true
    name: db-gateway
  # Cross-namespace ReferenceGrants. Only needed when Routes reference a
  # backend Service in a different namespace — NOT required for routes to
  # attach as parentRefs (that's covered by allowedRoutes.namespaces.from: All).
  # Gateway API admission requires a concrete source namespace per entry; no
  # wildcard is allowed. Provide an explicit list to render one grant per ns
  # per Gateway. Defaults to empty (no ReferenceGrants).
  referenceGrants:
    enabled: false
    fromNamespaces: []

# cert-manager Certificates for cluster wildcards.
# Requires cert-manager + a working DNS-01 ClusterIssuer. Guide:
# https://docs.orchard.hackclub.com/operate/wildcard-certificates/
# Set enabled=false if you provision Secrets out-of-band.
certificates:
  enabled: true
  namespace: network
  # Copy the wildcard TLS Secret from `namespace` into every tenant namespace
  # whose ingresses reference it. A wildcard is issued once but each tenant
  # Ingress names it locally, so without a copy those hosts serve no
  # certificate.
  #
  # Leave false if a secret replicator (emberstack/reflector, kubed) already
  # does this: two controllers replacing the same Secret each strip the other's
  # metadata and rewrite in a loop.
  copyToTenants: false
  issuer:
    name: letsencrypt-dns01-wildcard
    kind: ClusterIssuer
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  wildcards:
    # *.{gateway.http.appDomain}: the wildcard certificate for app hostnames.
    app:
      enabled: true
      domain: ""       # empty → falls back to gateway.http.appDomain
      secretName: ""   # empty → falls back to gateway.http.appWildcardSecretName
    # *.{db.domain} — used by the server's syncPublicTlsSecret() to copy
    # the wildcard cert into project namespaces for CNPG TLS. No domain, no
    # Certificate.
    db:
      enabled: true
      domain: ""
      secretName: wildcard-db-orchard-my-tls

# R2 backup proxy. Sits between tenant CNPG clusters and Cloudflare R2 so the
# real R2 credentials never live inside a tenant pod. Each cluster gets a
# per-cluster fake access key restricted to its own prefix; the proxy verifies
# V4 signatures and re-signs upstream with the real key. See r2-proxy/ for the
# Go service. Enabled by default — disable to fall back to handing the org's
# R2 credentials directly to barman (the legacy, less-isolated behavior).
# Orchard's own image scanner: a Trivy server that keeps the vulnerability
# database, plus one short-lived scan Job per request in its own namespace.
# Works with any registry the server pushes to, including the installer's zot.
# With nothing picked in Admin -> Instance -> Image scanning (or pinned with the
# IMAGE_SCANNER server env var), a deployed Orchard scanner is the one used.
# Harbor's own scanner is the other option and needs none of this.
trivy:
  enabled: false
  namespace: orchard-scans
  image: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  # Shared secret between the scan jobs and the Trivy server. Generated and
  # kept across upgrades when empty.
  token: ""
  # Scans running at once across the instance; extra requests are refused
  # until one finishes.
  maxConcurrentScans: 3
  scanTimeoutSeconds: 900
  # Offline or mirrored database sources. Empty uses Trivy's defaults
  # (mirror.gcr.io, then ghcr.io).
  dbRepository: ""
  javaDbRepository: ""
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  storage:
    size: 5Gi
    storageClass: ""

fcBuilder:
  # Experimental fast builder: one privileged fc-builder pod per node runs a
  # Firecracker microVM per project, with that project's BuildKit cache on a
  # persistent disk image. Deploying the hosts does nothing on its own; builds
  # only route here when serverEnabled is true. Which builds then go to it is
  # the routing mode: all, per_app, off, or flag (the PostHog flag
  # `firecracker-builder`). Empty means flag. Instance admin can change it, and
  # an app's own setting still overrides it. `orchardctl fast-builder enable`
  # sizes everything below to the host.
  enabled: false
  serverEnabled: false
  routing: ""
  namespace: orchard-fc-builders
  replicas: 2
  image:
    name: fc-builder
    tag: "1.1.0"
    repository: ""
  # Shared secret for the server -> fc-builder API. Empty keeps the existing
  # one, or mints one on first install.
  token: ""
  # Nodes that may host builder VMs. They need /dev/kvm; Talos nodes with the
  # kata extension already have it. Label them in talconfig:
  #   nodeLabels: { orchard-fc-builder: "true" }
  nodeSelector:
    orchard-fc-builder: "true"
  tolerations: []
  terminationGracePeriodSeconds: 90
  resources:
    requests: { cpu: "12", memory: 48Gi }
    limits: { cpu: "32", memory: 108Gi }
  storage:
    # Holds every project's cache disk image. A node-local single-replica class
    # keeps VM disk I/O off the network.
    storageClass: longhorn-build-scratch
    size: 1Ti
  vm:
    maxVms: 6
    vcpus: 8
    memoryMiB: 16384
    idleSeconds: 300
    cacheSize: 50G
    minNodeFreeMiB: 32768
    memoryOverheadMiB: 1536
  jailer:
    enabled: true
    cgroups: true
  # Queue slots for fast builds across all hosts.
  maxConcurrentBuilds: 16
  # Builds that may share one VM at once; more wait in the queue.
  maxBuildsPerVm: 2
  registry:
    # Where the push proxy forwards guest pushes. The proxy is the only place
    # registry credentials exist; guests never see them.
    upstream: http://harbor-core.harbor.svc.cluster.local
    username: ""
    password: ""
  # In-cluster egress besides DNS and the public internet. Harbor core only:
  # nothing else in the harbor namespace (its database) is reachable.
  registryEgress:
    - namespace: harbor
      podLabels:
        component: core
      ports:
        - port: 8080

r2Proxy:
  enabled: true
  namespace: orchard-r2-proxy
  # Bucket used for organizations that never configured their own backup
  # storage. Pair it with R2_BACKUP_BUCKET on the server.
  defaultBucket: ""
  # Buckets the proxy signs with the platform credentials. Defaults to
  # defaultBucket. With r2Proxy.upstream.endpoint set, one of the two is
  # required: an empty list would otherwise mean "every bucket", so the render
  # fails and the proxy refuses to start instead. Requests for any other bucket
  # are refused, whatever an organization names as its backup bucket.
  allowedBuckets: []
  # The bucket the proxy binds build cache keys to, rendered as
  # BUILD_CACHE_BUCKET. Empty takes BUILDKIT_S3_BUCKET from server.env. With
  # neither, a cache key may use the backup bucket or a bucket only
  # allowedBuckets lists. Database keys never reach a bucket named only here
  # or only in allowedBuckets.
  buildCacheBucket: ""
  # Password for the read-only orchard_r2_proxy postgres role. Left empty, the
  # chart keeps whatever the orchard-r2-proxy-db secret already holds, or mints
  # one on first install.
  databasePassword: ""
  replicas: 2
  image:
    name: r2-proxy
    tag: "0.8.1"
    # Falls back to the global image.repository. Set this to keep r2-proxy on a
    # registry path the other components have already moved off.
    repository: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "2", memory: "1Gi" }
  # Upstream S3 credentials, for any provider. The proxy needs ListBucket /
  # ReadObject / WriteObject / DeleteObject on the bucket(s) that orgs are
  # configured to back up to. Leave these empty to set storage in the setup
  # flow, under Instance admin, or with `orchardctl backups s3`: the server then
  # writes the r2-proxy-stored Secret, which the proxy re-reads while running.
  upstream:
    endpoint: ""   # e.g. https://s3.eu-west-1.amazonaws.com
    region: "auto"
    # false sends requests to <bucket>.<endpoint> instead of <endpoint>/<bucket>.
    pathStyle: true
    accessKey: ""
    secretKey: ""
  networkPolicy:
    enabled: true
  # Service URL the server uses for barman's endpointURL. Defaults to the
  # in-cluster Service DNS based on namespace above.
  serviceUrl: ""   # empty → http://r2-proxy.<r2Proxy.namespace>.svc.cluster.local:9000
  # Postgres URL the proxy uses to look up per-cluster bindings. When empty,
  # the chart `lookup`s the existing `<postgres.name>-app` Secret in the
  # orchard namespace at template time and copies its `uri` value here.
  # Override to point at a read-only role (recommended in prod).
  databaseUrl: ""

# S3-compatible object storage inside the cluster (versitygw on one PVC), so
# database backups, checkpoints, point-in-time restore, forks, the 30-day trash
# and restore tests work on an instance with no external storage. Off by
# default; the one-command installer turns it on.
#
# This is NOT disaster recovery: the backups sit on the same disks as the
# databases they protect. Add S3 storage for that (see "Object storage" under
# Instance admin, Configuration, or `orchardctl backups s3 set`).
#
# With `backups` on, the server uses this store through its LOCAL_STORE_*
# variables, as a fallback: storage saved under Instance admin and any R2_*
# variable win, and the fields stay editable. r2Proxy uses it as its upstream
# unless r2Proxy.upstream.endpoint is set. Tenant databases only ever reach it
# through r2Proxy, which must stay enabled.
objectStorage:
  local:
    enabled: false
    namespace: orchard-object-storage
    image: versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    # Runs once per chart change to create the bucket.
    bucketImage: amazon/aws-cli:2.40.2@sha256:acc32af784911165a8e78b63950625d174ba79b800a66a436c974689c87cd755
    bucket: orchard-backups
    # Avatars, icons and other uploads when no S3 storage is set. The server
    # serves them through its API, so this bucket stays private. Empty turns
    # uploads off until S3 storage is added.
    uploadsBucket: orchard-uploads
    # The region every client signs with. versitygw rejects any other, and the
    # server and r2-proxy sign with "auto".
    region: auto
    backups: true
    # Root credentials. Generated and kept across upgrades when empty.
    accessKey: ""
    secretKey: ""
    resources:
      requests: { cpu: "20m", memory: "64Mi" }
      limits: { cpu: "1", memory: "512Mi" }
    storage:
      size: 20Gi
      # Empty uses the cluster's default StorageClass.
      storageClass: ""

# Where the "what's new" sheet reads latest.json and the release notes from.
# Empty keeps the server's default; "off" hides the sheet. A value in
# server.env wins.
updates:
  url: ""

# Tenant pod sandboxing. When enabled, tenant Deployments created via the
# API set `runtimeClassName: gvisor` so their pods run under runsc (a
# user-space kernel) instead of the host kernel.
#
# REQUIREMENT before flipping enabled=true: the `siderolabs/gvisor` Talos
# system extension must be installed on every node (talos/talconfig.yaml).
# Without it, new tenant pods will fail to schedule with "no runtime for
# 'runsc' is configured".
#
# Rollout order:
#   1. Update talos/talconfig.yaml, regen schematic image, roll nodes.
#   2. Confirm `kubectl get runtimeclass gvisor` exists and a smoke test
#      pod with `runtimeClassName: gvisor` runs.
#   3. Flip enabled to true and `helm upgrade`.
tenantSandbox:
  enabled: false
  runtimeClassName: gvisor

devices:
  classes: []

# PriorityClass for the platform's own pods (server, worker, frontend, MCP, Redis,
# Postgres and pooler, logs and metrics stores, object storage, R2 proxy). It
# makes the scheduler place them before tenant workloads, which keep the default
# priority 0, and the kubelet evict them last under node pressure. Tenants never
# choose a class: the server sets none, and the admission policy refuses
# system-* and orchard-* names in tenant namespaces. The class is cluster scoped
# and its value is fixed at 100000. Turning this off also drops the setting from
# the platform pods.
priorityClasses:
  enabled: true

# Admission guard for tenant namespaces (namespaces labelled orchard.my/managed):
# native ValidatingAdmissionPolicies that refuse the object shapes Orchard never
# creates (hostPath, privileged pods, externalIPs, NodePort when off, foreign
# Ingress annotations, PVC hijack, open NetworkPolicy egress, ...). Needs
# Kubernetes >= 1.30. Every policy fails open (failurePolicy Ignore, missing
# parameters skip the rule), so a fault in the guard cannot block the cluster.
#
# validationActions: [Deny] refuses violations. Every object Orchard builds is
# admitted (policies/fixtures/benign), so only shapes Orchard never creates are
# refused. Set [Warn, Audit] to report without refusing. hardeningActions covers
# the rules legacy pods may fail (drop ALL capabilities, tenant RuntimeClass), so
# it stays advisory by default: a refusal there would stop old pods restarting.
admissionPolicies:
  enabled: true
  validationActions: [Deny]
  hardeningActions: [Warn, Audit]
  # Defaults to system:serviceaccount:<namespace>:orchard-server.
  serverUser: ""
  # Defaults to tenant.ingressClass; empty skips the ingress class rule.
  ingressClass: ""
  # Issuers allowed on tenant Ingresses besides tenant.certClusterIssuer, e.g.
  # your DNS-01 wildcard issuer. With none configured the rule is skipped.
  extraIssuers: []
  # StorageClasses a tenant PVC may name. Empty skips the rule.
  storageClasses: []
  # Defaults to the ClusterIP of the server Service (looked up at install time).
  protectionProxyIPs: ""
  # Image prefixes CNPG clusters may use, e.g. ["ghcr.io/cloudnative-pg/postgresql:"]. Empty skips.
  pgImagePrefixes: []
  # Libraries a CNPG cluster may preload (postgresql.shared_preload_libraries). Empty skips.
  pgPreloadLibraries: []

# Pods Orchard does not build itself (CloudNativePG instance and pooler pods,
# the Tailscale proxy) cannot take a runtimeClassName from the CNPG CRD. When
# runtimeClassName is set, a native MutatingAdmissionPolicy sets it on those
# pods at creation in orchard.my/managed namespaces (needs Kubernetes with the
# MutatingAdmissionPolicy API). Empty (the default) changes nothing.
#
# Operator-optional: sandboxed Postgres pays an IO and latency cost. It affects
# only pods created or recreated afterwards, so roll each cluster yourself
# (switchover, then delete the old primary) when you are ready.
# runtimeClassFailurePolicy Ignore keeps a policy bug from blocking pod creation;
# Fail guarantees no unsandboxed database pod is ever admitted.
databases:
  runtimeClassName: ""
  runtimeClassFailurePolicy: Ignore

# Builder pod sandboxing. Image-build jobs need `privileged: true` for
# BuildKit, which gVisor refuses. Kata Containers wraps the pod in a
# lightweight VM, so privileged-in-VM is fine and a malicious Dockerfile
# can't reach the host kernel.
#
# REQUIREMENT before flipping enabled=true: `siderolabs/kata-containers`
# Talos system extension installed on every node, plus KVM available on
# the host (bare-metal Hetzner nodes have KVM natively).
#
# Two independent toggles:
#   runtimeClassName: if non-empty, build Jobs run with this runtimeClass.
#                     Set to "kata" once the extension is rolled out.
#   sidecarPush:      on by default. BuildKit runs as an init container with
#                     NO registry login mounted, and a small pusher container
#                     becomes the main container with the login. A Dockerfile
#                     can't pull another tenant's image, or read the login,
#                     because it isn't there during the build step.
builderSandbox:
  enabled: false
  runtimeClassName: kata
  handler: kata
  # RuntimeClass for super builds (Depot). Those pods clone, tar and upload
  # the context to Depot's builders and never execute repo code, so a full
  # VM per build is wasted; gVisor is enough. Requires the RuntimeClass to
  # exist (tenantSandbox renders it) — set to "" to reuse runtimeClassName.
  depotRuntimeClassName: gvisor
  sidecarPush: true
  # Image used by the pusher container in sidecarPush mode. Must contain
  # the `skopeo` binary on PATH.
  #
  # quay.io/skopeo/stable is the upstream Red Hat image. If you want to be
  # airtight, mirror this into your own registry and point at the
  # mirrored copy:
  #   skopeo copy docker://quay.io/skopeo/stable:v1.24.1 \
  #               docker://registry.example.com/orchard/skopeo:v1.24.1
  # Then set pusherImage: registry.example.com/orchard/skopeo:v1.24.1
  pusherImage: quay.io/skopeo/stable:v1.24.1@sha256:4b440098ada2bc2623308b0f60f5a5454084b98683e9e7dcecd77bba69797c56
  # Back workspace and output emptyDirs with tmpfs (memory) instead of disk.
  # Bypasses virtio-fs overhead in kata VMs — filesystem ops happen at memory
  # speed inside the guest. Counts against the container's memory limit.
  tmpfsWorkspace: false
  scratch:
    # Where BuildKit's snapshotter scratch lives. Leave empty to follow the
    # isolation setting: tmpfs under a VM runtime class (where it avoids
    # virtio-fs), plain node disk without one.
    #
    # tmpfs is charged to the build pod's memory cgroup, so `size` becomes a
    # RAM reservation and caps how many builds fit on a node. Only worth it
    # when runtimeClassName is set. Override with tmpfs, disk or block.
    mode: ""
    size: 40Gi
    # Only used in block mode. Empty uses the cluster's default StorageClass.
    storageClass: ""
  memoryLimit: ""

# AI dev machines (Greenhouse). Cloud machines with coding agents on them,
# one per sandbox, on one of two runners: "kubernetes" (pods in their own
# namespace, orchestrated through the kubernetes-sigs/agent-sandbox controller,
# Kata VMs when runtimeClassName is set) and "vercel" (Vercel Sandbox microVMs).
# Operator guide: apps/docs/src/content/docs/operate/greenhouse.md.
#
# Greenhouse itself is the `greenhouse` graft: add it to `grafts` to turn it on.
# These values are the cluster plumbing and settings it reads:
#   - install renders the namespace, quota, NetworkPolicy, RBAC and SANDBOX_*
#     settings the kubernetes runner needs. null follows `enabled`.
#   - enabled=true is shorthand for install=true.
# `runners` is rendered either way.
#
# REQUIREMENTS for the kubernetes runner:
#   1. agent-sandbox controller + CRDs installed in the cluster (pinned
#      release manifest, managed out of band; this chart does not install
#      them).
#   2. For VM isolation: a kata RuntimeClass on the nodes (same requirement
#      as builderSandbox). Leave runtimeClassName empty on clusters without
#      kata; machines then run on runc with a Filesystem-mode home PVC
#      (slower, no block-device fast path). On runc the machine's init runs
#      as root and its user has passwordless sudo, so the boundary is the
#      container: every capability dropped except AUDIT_WRITE, CHOWN,
#      DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE, SETGID, SETUID
#      and SYS_CHROOT, RuntimeDefault seccomp, and a namespace that enforces
#      the baseline Pod Security Standard. Machines share the node kernel, so
#      a kernel escape reaches every machine on the node; use kata when
#      machine users are not trusted.
#   3. For forking: a VolumeSnapshotClass whose driver matches the home
#      volume StorageClass. Without one, forking is not offered.
# The default image ships sshd, git, tmux, Node.js, every supported agent
# (Claude Code, opencode, fx, Codex and their ACP adapters) and the orchard
# daemon, so a machine boots in seconds. Any other image works too: the
# bootstrap installs whatever is missing on first boot, which is slow.
sandbox:
  enabled: false
  install: null
  namespace: orchard-sandboxes
  image: ghcr.io/hackclub/orchard/sandbox:latest
  runtimeClassName: kata
  # Running machines are stopped after this many minutes with no terminal or
  # SSH activity (0 = never). A working agent counts as activity.
  idleTimeoutMinutes: 60
  # Running machines are stopped this many hours after their last start,
  # active or not (0 = never). Stopped, not deleted.
  maxLifetimeHours: 168
  # Default per-user machine cap; override per user via /admin/greenhouse.
  maxPerUserDefault: 1
  # Empty = the cluster's default StorageClass.
  storageClass: ""
  diskSize: 10Gi
  cpuLimit: "2"
  # Sizes the kata VM; keep >= 1Gi.
  memoryLimit: 4Gi
  # Transport to machine pods: empty = direct in-cluster TCP to pod IPs. Set
  # "portforward" only for a server running outside the cluster.
  tunnelMode: ""
  # Home PVC mode: empty = auto (Block when runtimeClassName is set,
  # Filesystem otherwise). Explicit "block" or "filesystem" to override.
  homeMode: ""
  # Where machines run. Each value left empty/null renders no env var, so the
  # field stays editable under Instance admin -> Configuration -> Sandbox
  # runners; anything set here is env-locked there. Rendered whether or not
  # `enabled` is true.
  runners:
    # "kubernetes" or "vercel"; empty lets the admin pick (and falls back to
    # the first available runner).
    default: ""
    kubernetes:
      enabled: null
    vercel:
      enabled: null
      # Secret holding the Vercel access token (never put the token in values).
      # Vercel machines also need server SECRETS_ENCRYPTION_KEY.
      tokenSecret:
        name: ""
        key: token
      teamId: ""
      projectId: ""
      # Empty = vercel/sandbox/universal.
      image: ""
      # 1-8; empty = 2.
      vcpus: ""
      # Vercel's own stop timer, 1-1440; empty = 60. Orchard extends it while
      # a machine is in use.
      timeoutMinutes: ""
      # Size in GiB of the Vercel drive that holds each machine's /persist
      # (home, ssh host keys), 1-16384; empty = 50; 0 = no drives, homes live
      # in snapshots only. Existing drives keep the size they were created with.
      driveGiB: ""
    # https URL of the linux/amd64 orchard CLI tarball that Vercel machines run
    # as their ssh bridge. Empty = the release matching the server's pinned
    # version, verified against that release's checksums.txt.
    bridgeBinaryUrl: ""
    # SHA-256 of the bridgeBinaryUrl tarball. Required when bridgeBinaryUrl is
    # set; machines refuse a download that does not match.
    bridgeBinarySha256: ""
    # Bare domain for kubernetes preview URLs (<port>-<machine>.<domain>), e.g.
    # orchard-preview.dev. Must not be, contain or sit under the Orchard cookie
    # domain or hostnames. Needs wildcard DNS pointing at the ingress; the
    # route and certificate come from `previews` below. Empty = kubernetes
    # previews off.
    previewDomain: ""
  # Rendered only when runners.previewDomain is set.
  previews:
    # A Traefik IngressRoute sending every path on *.<previewDomain> to the
    # server service, on ingress.entryPoints. Set false to bring your own.
    route: true
    tls:
      # Secret Traefik terminates preview TLS with. Empty = <release>-sandbox-previews-tls.
      secretName: ""
      # cert-manager issuer for the *.<previewDomain> certificate. Wildcards
      # need a DNS-01 issuer. Empty = certificates.issuer when
      # certificates.enabled, else no Certificate is rendered and secretName
      # must already exist.
      issuerRef: {}
  quota:
    pods: "20"
    cpu: "40"
    memory: "80Gi"

# Public-TLS reflection — tells the server which Secret to copy from when
# exposing a CNPG cluster publicly with TLS.
publicTls:
  db:
    sourceNamespace: ""   # empty → certificates.namespace
    sourceSecret: ""      # empty → certificates.wildcards.db.secretName
    localSecret: wildcard-db-tls
    # wildcard: copy the shared *.db wildcard key into every tenant namespace
    #   (anyone who can exec into a database pod can read it and impersonate
    #   every other database under the wildcard).
    # perDatabase: cert-manager issues one certificate per public database for
    #   its own hostname only; the wildcard key stays in `sourceNamespace`.
    #   Needs a DNS-01 issuer and counts against ACME rate limits.
    mode: wildcard
    issuer: {}
    legacyHostnames: false

grafts: []

graftSettings:
  # required (default) or auto. Whether the registry's signed template catalogue
  # and graft revocation list must verify. auto accepts an unsigned index only
  # until the first signed one has been seen. Set auto to use a registry you run
  # yourself that publishes no signature.
  registrySignature: ""
  # Which grafts may load: official (Orchard's own), listed (official,
  # community grafts from the Extension Marketplace, and grafts signed by a key
  # in `keys`), taps (listed plus grafts from the taps below) or any (unsigned
  # too). `signed` is the old name for `listed` and still works.
  trust: listed
  # Raw ed25519 publisher keys (base64, as `graft keygen` prints them).
  keys: []
  # Third-party graft catalogues, added with `orchardctl graft tap add`. Each
  # needs a name, the https url of the folder holding tap.json, and the tap's
  # public key. A graft entry with `tap: <name>` downloads from that tap and
  # must be signed with its key. Taps only load when trust is taps or any.
  #   - name: acme
  #     url: https://grafts.example.com/orchard
  #     key: <base64 ed25519 public key>
  taps: []
  marketplaceUrl: ""
  strict: false
  safeMode: false
  # Database connections each graft may open per pod, by graft id. Overrides
  # what the graft asks for in graft.json (database.pool, default 3). The admin
  # Grafts page shows how close all pods together come to Postgres's limit.
  pools: {}

databaseDumps:
  enabled: false
  schedule: "15 2 * * *"
  image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
  uploaderImage: amazon/aws-cli:2.40.2@sha256:acc32af784911165a8e78b63950625d174ba79b800a66a436c974689c87cd755
  destination:
    bucket: ""
    prefix: platform-dumps
    endpointURL: ""
    secretName: database-dumps-r2
    # How many dumps to keep per target. 0 keeps them all.
    keep: 0
  targets: []
